name: findus_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter


  fl_chart: ^0.69.0
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  google_fonts: ^6.3.3
  font_awesome_flutter: ^10.12.0
  image_picker: ^1.2.1
  file_picker: ^8.0.0
  shared_preferences: ^2.5.3
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  percent_indicator: ^4.2.5
  url_launcher: ^6.3.2
  lottie: ^3.3.2
  syncfusion_flutter_pdfviewer: ^31.2.18
